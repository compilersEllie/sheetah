from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false

pre_bump_hooks = [
    "cargo build --release",
    "echo 'bumping from {{latest|0.0.0}} to {{version|0.0.1}}'",
]
post_bump_hooks = [
    "git add CHANGELOG.md",
    "cargo workspaces version --allow-branch main custom {{version|0.0.1}}",
    "git push",
    "git push origin {{version}}",
    # "cargo publish",
]

pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "sheetah"
owner = "compilersEllie"
authors = [
  { username = "compilersEllie", signature = "Eleanor Pratt"}
]

[bump_profiles]
