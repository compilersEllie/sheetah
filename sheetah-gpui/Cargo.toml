[package]
name = "sheetah-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.0" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.0", features = ["wayland"] }
sheetah-model = { workspace = true }

[dev-dependencies]
gpui_platform = { package = "gpui-fast-platform", version = "0.1.0", features = ["wayland", "test-support"] }
rand = "0.10.3"
