[package]
name = "sheetah-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.0" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.0", features = ["wayland"] }
sheetah-model = { path = "../sheetah-model" }
tokio = { version = "1.53.3", features = ["sync"] }

[dev-dependencies]
gpui = { package = "gpui-fast", version = "0.1.0", features = ["test-support"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.0", features = ["wayland", "test-support"] }
image = "0.25"
