[package]
name = "sheetah-model"
version = "0.1.0"
authors = ["Ellie Pratt <ellie@skfl.tech>"]
edition = "2024"

[dependencies]
thiserror = "1.0"
async-trait = "0.1.92"
byteorder = "1.5.0"
futures = "0.3.34"
inventory = "0.3.25"
serde = { version = "1.0.229", features = ["serde_derive", "derive"] }
stable-hash = "0.4.3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync"] }
typetag = "0.2.23"

[dev-dependencies]
proptest = "1.4.0"
