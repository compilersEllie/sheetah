[package]
name = "sheetah-model"
version = "0.1.0"
authors = ["Ellie Pratt <ellie@skfl.tech>"]
edition = "2024"

[dependencies]
inventory = "0.3.25"
platform-dirs = "0.3.0"
postcard = "1.1.3" # Consider serde-zap later
serde = { version = "1.0.229", features = ["serde_derive", "derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order", "arbitrary_precision", "float_roundtrip"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
