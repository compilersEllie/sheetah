name: rust

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust CI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest]

    steps:
    - uses: actions/checkout@v6
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.11
    - uses: actions/cache@v5
      with:
        path: |
          /home/runner/.cargo/
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          ${{ runner.os }}-cargo-
          ${{ runner.os }}-
    - name: Install system packages
      run: sudo apt update && sudo apt install libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

    - name: Run tests (dev)
      if: github.event.pull_request.merged == false
      run: cargo test --locked --verbose
    - name: Run ignored tests (dev)
      continue-on-error: true
      if: github.event.pull_request.merged == false
      run: cargo test --locked --verbose -- --ignored

    - name: Run tests (release)
      if: github.event.pull_request.merged == true
      run: cargo test --locked --release --verbose
    - name: Run ignored tests (release)
      if: github.event.pull_request.merged == true
      run: cargo test --locked --release --verbose -- --ignored

    - name: Build (dev)
      if: github.event.pull_request.merged == false
      run: cargo build --locked --verbose
    - name: Build (release)
      if: github.event.pull_request.merged == true
      run: cargo build --locked --release --verbose

    - name: Install clippy
      run: rustup component add clippy
    - name: Clippy
      run: cargo clippy --all-features -- -D warnings
    - name: Install fmt
      run: rustup component add rustfmt
    - name: Format
      run: cargo fmt --all -- --check

    - name: Upload executable Linux
      if: github.ref == 'refs/heads/master' && runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: rust
        path: ./target/release/*
        overwrite: true
        archive: true
        if-no-files-found: error
    - name: Upload executable Windows
      if: github.ref == 'refs/heads/master' && runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: rust.exe
        path: ./target/release/*.exe
        overwrite: true
        archive: true
        if-no-files-found: error
