name: rust

on: [push]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust CI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest]
    steps:
    - name: Refresh apt package lists
      run: sudo apt-get update
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libayatana-appindicator3-dev libglib2.0-dev
        version: 1.2
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
        components: rustfmt, clippy
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "rust-stable-${{ runner.os }}"
        cache-on-failure: true
    - uses: actions/checkout@v6
    - name: Clippy
      run: cargo clippy --all-features -- -D warnings
    - name: Format
      run: cargo fmt --all -- --check

    - name: Run tests (dev)
      if: github.event.pull_request.merged == false
      run: cargo test --locked --verbose
    - name: Run ignored tests (dev)
      continue-on-error: true
      if: github.event.pull_request.merged == false
      run: cargo test --locked --verbose -- --ignored

    - name: Run tests (release)
      if: github.event.pull_request.merged == true
      run: cargo test --locked --release --verbose
    - name: Run ignored tests (release)
      if: github.event.pull_request.merged == true
      run: cargo test --locked --release --verbose -- --ignored

    - name: Build (dev)
      if: github.event.pull_request.merged == false
      run: cargo build --locked --verbose
    - name: Build (release)
      if: github.event.pull_request.merged == true
      run: cargo build --locked --release --verbose

    - name: Upload executable Linux
      if: github.ref == 'refs/heads/master' && runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: rust
        path: ./target/release/*
        overwrite: true
        archive: true
        if-no-files-found: error
    - name: Upload executable Windows
      if: github.ref == 'refs/heads/master' && runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: rust.exe
        path: ./target/release/*.exe
        overwrite: true
        archive: true
        if-no-files-found: error
