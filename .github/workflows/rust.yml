name: rust

on: [push]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  rust:
    name: rust CI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest]

    steps:
    - uses: actions/checkout@v6
    - name: Install sccache
      if: runner.os == 'Linux'
      uses: mozilla-actions/sccache-action@v0.0.11

    - uses: swatinem/rust-cache@v2

    - name: Install system packages
      if: runner.os == 'Linux'
      run: |
        sudo apt update && \
        sudo apt install \
          libglib2.0-dev \
          libgtk-3-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libwebkit2gtk-4.1-dev

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Security Audit
      run: cargo audit

    - name: Install clippy
      run: rustup component add clippy
    - name: Clippy
      run: cargo clippy --all-features -- -D warnings
    - name: Install fmt
      run: rustup component add rustfmt
    - name: Format
      run: cargo fmt --all -- --check

    - name: Run tests (dev)
      if: github.event.pull_request.merged == false
      run: |
        cargo test --locked --verbose
        cargo test --locked --verbose -- --ignored

    - name: Run tests (release)
      if: github.event.pull_request.merged == true
      run: |
        cargo test --locked --release --verbose
        cargo test --locked --release --verbose -- --ignored

    - name: Build (dev)
      if: github.event.pull_request.merged == false
      run: cargo build --locked --verbose

    - name: Build (release)
      if: github.event.pull_request.merged == true
      run: cargo build --locked --release --verbose

    - name: Upload executable Linux
      if: github.ref == 'refs/heads/master' && runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: rust
        path: ./target/release/*
        overwrite: true
        archive: true
        if-no-files-found: error
    - name: Upload executable Windows
      if: github.ref == 'refs/heads/master' && runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: rust.exe
        path: ./target/release/*.exe
        overwrite: true
        archive: true
        if-no-files-found: error
